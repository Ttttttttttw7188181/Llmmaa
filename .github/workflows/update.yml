name: Build VPN subscription

on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build config
        run: python scripts/build.py
      - name: Commit generated files
        run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "Update generated VPN subscription"
            git push
          else
            echo "Generated files unchanged."
          fi
