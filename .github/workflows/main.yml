
name: Update VLESS Source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: vpn-subscription-update
  cancel-in-progress: false

jobs:
  update-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VLESS Reality source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" \
            -o source/Vless-Reality-White-Lists-Rus-Mobile.txt

          test -s source/Vless-Reality-White-Lists-Rus-Mobile.txt

          if ! grep -Eiq 'vless://|"type"[[:space:]]*:[[:space:]]*"vless"' \
            source/Vless-Reality-White-Lists-Rus-Mobile.txt; then
            echo "ERROR: Downloaded file does not appear to contain VLESS entries."
            exit 1
          fi

          echo "Source downloaded and basic validation passed."

      - name: Commit updated source
        shell: bash
        run: |
          set -euo pipefail

          git add source/Vless-Reality-White-Lists-Rus-Mobile.txt

          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update VLESS source"
          git push
